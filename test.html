<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Icon Picker</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        .icon-box {
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            padding: 15px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .icon-box:hover {
            background-color: #f8f9fa;
            transform: scale(1.1);
            border-color: #0d6efd;
        }
        /* Membatasi tinggi container agar bisa di-scroll */
        #icon-container {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="p-4">

    <div class="container">
        <h3 class="mb-4">Pilih Ikon</h3>
        
        <div class="mb-4">
            <label class="form-label">Ikon yang dipilih (Class Name):</label>
            <div class="input-group">
                <span class="input-group-text" id="preview-icon"><i class="bi bi-star"></i></span>
                <input type="text" id="selected-icon-input" class="form-control" readonly placeholder="Klik ikon di bawah...">
            </div>
        </div>

        <input type="text" id="search-icon" class="form-control mb-3" placeholder="Cari nama ikon...">

        <div id="icon-container" class="row g-2">
            <div class="text-center text-muted" id="loading">Memuat ikon...</div>
        </div>
    </div>

    <script>
        const iconContainer = document.getElementById('icon-container');
        const searchInput = document.getElementById('search-icon');
        const selectedInput = document.getElementById('selected-icon-input');
        const previewIcon = document.getElementById('preview-icon');
        let allIcons = [];

        // 2. Fetch data JSON dari CDN Bootstrap Icons
        fetch('https://unpkg.com/bootstrap-icons@1.11.3/font/bootstrap-icons.json')
            .then(response => response.json())
            .then(data => {
                // Hapus tulisan loading
                document.getElementById('loading').remove();
                
                // Objek JSON berisi key (nama ikon) dan value (unicode). Kita ambil key-nya saja.
                allIcons = Object.keys(data);
                renderIcons(allIcons);
            })
            .catch(error => {
                console.error("Gagal mengambil data ikon:", error);
                iconContainer.innerHTML = '<div class="text-danger">Gagal memuat ikon. Pastikan koneksi internet aktif.</div>';
            });

        // 3. Fungsi untuk me-render ikon ke HTML
        function renderIcons(iconsToRender) {
            iconContainer.innerHTML = ''; // Bersihkan container
            
            iconsToRender.forEach(iconName => {
                // Buat elemen kolom
                const col = document.createElement('div');
                col.className = 'col-2 col-md-1';
                
                // Buat kotak ikon
                const iconBox = document.createElement('div');
                iconBox.className = 'icon-box';
                iconBox.innerHTML = `<i class="bi bi-${iconName}"></i>`;
                iconBox.title = iconName; // Tooltip saat di-hover
                
                // 4. Event listener saat ikon di-klik
                iconBox.addEventListener('click', () => {
                    const fullClassName = `bi bi-${iconName}`;
                    selectedInput.value = fullClassName;
                    previewIcon.innerHTML = `<i class="${fullClassName}"></i>`;
                });

                col.appendChild(iconBox);
                iconContainer.appendChild(col);
            });
        }

        // 5. Fitur Pencarian (Realtime)
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filteredIcons = allIcons.filter(icon => icon.includes(keyword));
            renderIcons(filteredIcons);
        });
    </script>
</body>
</html>
